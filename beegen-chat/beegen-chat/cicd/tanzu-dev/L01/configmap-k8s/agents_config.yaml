  - bot_id: "cbc75713-2646-4331-84ad-645664ab86ef"
    name_reconition: "bee247"
    name: "Bot 247"
    description: |
      Agent chuyên tư vấn, giải đáp và hướng dẫn khách hàng cá nhân sử dụng các sản phẩm, dịch vụ ngân hàng số MB Bank.
