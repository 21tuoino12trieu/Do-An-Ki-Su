#Chi sua gia tri, khong thay doi key
# So luong pod duoc tao
replicaCount: 1

# Khai bao service
# Type = NodePort cap nhat cac truong (nodePort,port,targetPort)
# Type = LoadBalancer cap nhat cac truong (port,targetPort,loadBalancerIP)
# Type = ClusterIP cap nhat cac truong (port,targetPort)
service:
  type: ClusterIP
  # nodePort: 8080
  port: 8000
  targetPort: 8000

# Khai bao hostnames
hostAliases:
  10.6.1.3: us-central1-aiplatform.googleapis.com

# Khai bao su dung configmap
configMaps:
  - agents_config.yaml
  - azure.yaml
  - beegen_v1.yaml
  - beegen_v2.yaml
  - authen.yaml
  - embedding.yaml
  - logging.yaml
  - milvus.yaml
  - mongo.yaml
  - reranker.yaml
  - mcp_config.yaml
  - default_mcp.json
  - langfuse.yaml
  - litellm.yaml
  - neo4j.yaml
  - postgres.yaml
  - chunker.yaml
  - beegen_v3.yaml
  - crm.yaml
  - postgre_hcm.yaml
  - chatgpt.yaml
  - gemini.yaml
  - beeflow.yaml
  - bytebase.yaml
  - beegen_v2_.yaml
  - litellm_.yaml
  - beegen_multimedia.yaml
  - metadata_query.yaml
# Khai bao su dung PVC
pvc: false
namePVC:

# Khai bao volumeMount
volumeMountsMap:
  mountPathcommon: /deployment/common/config
  mountPathconfig: /deployment/config
  mountPathpodinfo: /deployment/podinfo
  mountPathPVC:
    pvc-utilities: /data

#Khai bao tai nguyen su dung cho pod
resources:
  requests:
    memory: 128Mi

# Khai bao promethus de gia tri promethus true,nguoc lai de false
promethus: true
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /api/actuator/prometheus
  prometheus.io/port: "8000"

# Khai bao label cho istio
labels: true
templateLabels:
  app-id-005: 01066-01-004

# Khai bao HealthCheck de gia tri healthCheck true,nguoc lai de false
healthCheck: false
startupProbe:
  failureThreshold: 10
  httpGet:
    path: /api/actuator/health
    port: 8000
    scheme: HTTP
  periodSeconds: 5
  successThreshold: 1
  timeoutSeconds: 2
livenessProbe:
  failureThreshold: 10
  httpGet:
    path: /api/actuator/health
    port: 8000
    scheme: HTTP
  periodSeconds: 5
  successThreshold: 1
  timeoutSeconds: 2
readinessProbe:
  failureThreshold: 10
  httpGet:
    path: /api/actuator/health
    port: 8000
    scheme: HTTP
  periodSeconds: 5
  successThreshold: 1
  timeoutSeconds: 2

# Command.option-(Bat buoc): [java, golang, dotnet, python-uvicorn, python-gunicorn, python, angular, manual]
# Command.binaryfile-(Bat buoc voi cac option: java, golang, dotnet, python-uvicorn, python):
# file nhi phan cua app: file.jar-java, file.dll-dotnet, file-golang, main.app-python-uvicorn, main.py-python
# Command.manual-(Bat buoc neu option la "manual"): command cli entrypoint
# Bien moi truong tuong ung cho tung option: java-JVM_OPTS, golang-GO_OPTS, dotnet-DOTNET_OPTS, python*-PYTHON_OPTS
Command:
  # -- Options: [java, golang, dotnet, python-uvicorn, python-gunicorn, python, angular, manual]
  option: manual
  manual: sh run.sh

# Khai bao bien moi truong
ENV_PROFILE: tanzu
# JVM_OPTS: -Xms512m -Xmx2048m -Djava.security.egd=file:/dev/./urandom -Dsun.net.http.retryPost=false -Dhttp.retryPost=false -Dspring.profiles.active=dev -Dspring.config.location=/deployment/config/application.properties -Dlogging.config=/deployment/config/log4j2-spring.xml
# JAVA_TOOL_OPTIONS: -Xms512m -Xmx2048m -Dsun.net.http.retryPost=false -Dhttp.retryPost=false -Dspring.config.location=/deployment/config/application.properties -Dlogging.config=/deployment/config/log4j2-spring.xml
# GO_OPTS: golang
# DOTNET_OPTS: donet
# PYTHON_OPTS: python

# Chi dinh pod chay tren node co dinh(chi dung tren live: default hoac ecm)
NodeSelectorEnable: false
nodeName: default

# So lan deploy Helm
numberHelm: H1

# Thong tin image
image:
  repository: image_version
  pullPolicy: Always
  tag: "image_tag"

# Khai bao secret-registry harbor
imagePullSecrets:
  - name: harbor-secret-registry

########### Dung thi coppy vao ##########
# Khai bao gRPC service
gRPCEnable: false
gRPCService:
  nodePortgrpc: 10780
  portgrpc: 10780

# Khai bao hpa thi de gia tri hpa true,,nguoc lai de false
autoscaling:
  enabled: false
  minPodsHPA: 1
  maxPodsHPA: 1
  # cpuHPA: 80
  memoryHPA: 300
  # ExternalMetricName: logstash_kafka_consumergroup_lag
  #ExternalMetricAvgValue: 11
  #ExternalMetricValue: 10

## Tao Service Account
serviceAccount:
  create: true
  name: k8s_sa

### Configure kind
#statefulset: true
#canary: true
#Ten project thuc hien canary va role opa luu tren keycloak
canary: false
projectName: ms-card-partner-new

# OpaEnvoy
### Dung thi copy noi dung duoi vao file values
opaEnvoy:
  enabled: false
  OPA_ENV: prod ### images base opa to env
  label: default
  opalServer: http://opal-server-service.opa-istio.svc.cluster.local:8003

### Cau hinh dung vault tap chung
VaultInject: false

# Khai bao su dung configmap tap chung
# ConfigMapsCommonName: Ten Configmap-Common.
# ConfigMapsCommonData: Doi voi Configmap-Common co nhieu files,  ConfigMapsCommonData chi ra se su dung file nao trong Confimap-Common tren.
ConfigCommon: false
ConfigMapsCommonName: esb-common-config
ConfigMapsCommonData:
  - application-common.properties
# Trong Dockerfile se khai bao them CONFIGMAP_COMMON trong ENTRYPOINT de su dung configmap-common.
# Vi Du: ENTRYPOINT exec java $JVM_OPTS -jar -Doracle.jdbc.timezoneAsRegion=false interest-fee-management.jar --spring.config.location=$CONFIGMAP_COMMON,file:/deployment/config/application.properties
CONFIGMAP_COMMON: file:/deployment/common/application-common.properties

# Khai bao user
## User appadmin, ID 10000
## User nginx, ID 101
### Configure Pods Security Context
podSecurityContext:
  enabled: true
  fsGroup: 10000

### Configure Container Security Context
containerSecurityContext:
  enabled: true
  runAsUser: 10000
  runAsNonRoot: true
  readOnlyRootFilesystem: false

# Thoi gian gia han truc khi vung chua bi cham dut #
TerminationGracePeriodSeconds:
  enabled: true
  graceperiodseconds: 180
