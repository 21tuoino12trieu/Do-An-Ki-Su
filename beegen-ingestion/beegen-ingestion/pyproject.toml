[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beegen-ingestion"
version = "0.1.0"
description = "Confluence ingestion service"
requires-python = ">=3.10"

dependencies = [
  "python-dotenv",
  "aiokafka",
  "pyyaml",
  "motor",
]

[tool.setuptools.packages.find]
where = ["."]