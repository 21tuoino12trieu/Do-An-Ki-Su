[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
 
[tool.setuptools.packages.find]
# Include all packages you want
include = ["beeflow*", "beeapp*", "beegen*", "config*", "experimental*", "beedoc*", "mem0*", "langfuse*"]
# Or exclude unwanted ones
exclude = ["tests*", "docs*", "**/__pycache__", "__pycache__/*", "*.py[cod]"]

[project]
name = "beeflow"
version = "1.0.3"
description = "56601"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3==13.1.0",
    "aiocache>=0.12.3",
    "aiofiles>=24.1.0",
    "aiohttp>=3.12.15",
    "aiokafka>=0.12.0",
    "asyncio>=3.4.3",
    "asyncpg~=0.30.0",
    "bidict>=0.23.1",
    "build>=1.3.0",
    "cachetools>=5.3.3,<6.0",
    "cryptography>=46.0.2",
    "docstring-parser>=0.17.0",
    "fastapi>=0.116.1",
    "google-auth>=2.22.0,<3.0",
    "haikunator>=2.1.0",
    "jsonpath-ng>=1.7.0",
    "jsonschema>=4.25.0",
    "kafka-python-ng>=2.2.3",
    "line-profiler>=5.0.0",
    "litellm>=1.78.5",
    "logfire>=4.2.0",
    "lxml>=6.0.0",
    "motor>=3.7.1",
    "openai==1.109.1",
    "opencv-python-headless>=4.12.0.88",
    "openpyxl>=3.1.5",
    "oracledb>=3.4.0",
    "pillow>=11.3.0",
    "posthog>=6.7.9",
    "pre-commit>=4.3.0",
    "pydantic>=2.11.7",
    "pyjwt>=2.10.1",
    "pymilvus>=2.5.14",
    "pymongo>=4.13.2",
    "pymupdf>=1.26.3",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.1.1",
    "python-jose>=3.5.0",
    "python-keycloak==5.5.1",
    "pyyaml>=6.0.2",
    "qdrant-client==1.15.1",
    "rapidfuzz>=3.13.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "scipy>=1.16.1",
    "slowapi>=0.1.9",
    "sqlglot>=27.6.0",
    "typeguard>=4.4.4",
    "typing-extensions>=4.14.1",
    "unidecode>=1.4.0",
    "urllib3==1.26.15",
    "uvicorn>=0.35.0",
    "vertexai>=0.0.1",
]

[[tool.uv.index]]
url = "http://quanta:LOCAL_PASSWORD@10.1.12.177:8445/repository/pypi-proxy/simple"

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:.*SwigPy.*:DeprecationWarning",
  "ignore:.*swigvarlink.*:DeprecationWarning",
  "ignore:.*utcnow\\(\\) is deprecated.*:DeprecationWarning:botocore\\..*",
]
