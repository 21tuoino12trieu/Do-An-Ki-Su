app_name: aicenter-cua
environment: development
extra_fields: {}
kafka:
  extra_fields: null
  kafka_bootstrap_servers:
  - 10.1.54.151:9093
  - 10.1.54.152:9093
  - 10.1.54.153:9093
  - 10.1.54.50:9093
  - 10.1.54.51:9093
